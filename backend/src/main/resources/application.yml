spring:
  application:
    name: deploykit-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only validates that entities match it.
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

deploykit:
  helm:
    binary: ${HELM_BINARY:helm}
    # Relative to the working directory: the backend is started from backend/ locally.
    chart-path: ${DEPLOYKIT_HELM_CHART_PATH:../helm/deploykit-app}
  deployment:
    registry: ${DEPLOYKIT_REGISTRY:ghcr.io}

logging:
  structured:
    format:
      console: ecs
  level:
    com.deploykit: ${LOG_LEVEL:INFO}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
